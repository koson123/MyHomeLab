services:
  ollama:
    image: ollama/ollama:0.33.2
    container_name: automation_ollama
    restart: unless-stopped
    ports:
      - "10.50.0.114:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - /srv/automation/data/ollama:/root/.ollama
    cpus: 3.5
